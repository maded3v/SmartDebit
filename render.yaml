services:
  - type: web
    name: smartdebit-api
    runtime: python
    rootDir: .
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate && python manage.py seed_data
    startCommand: gunicorn smartdebit_core.wsgi:application
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DB_SSL_REQUIRE
        value: "True"
      - key: DB_ENGINE
        value: django.db.backends.sqlite3
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        value: smartdebit-api.onrender.com,localhost,127.0.0.1
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        value: https://smartdebit-frontend.vercel.app,http://127.0.0.1:5173,http://localhost:5173
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://smartdebit-frontend.vercel.app,http://127.0.0.1:5173,http://localhost:5173
